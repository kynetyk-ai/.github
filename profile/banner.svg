<svg viewBox="0 0 1128 191" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;">
  <!-- Base background -->
  <rect width="1128" height="191" fill="#0c0c14"/>

  <defs>
    <!-- Unified aurora glow — all four pillar colors converging -->
    <radialGradient id="li-glow-1" cx="62%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#6c9cff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#c49cff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0c0c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Honest Signal warmth (left-center) -->
    <radialGradient id="li-glow-hs" cx="35%" cy="55%" r="25%">
      <stop offset="0%" stop-color="#6cffc4" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#6c9cff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0c0c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Ghost warmth (center) -->
    <radialGradient id="li-glow-gm" cx="50%" cy="45%" r="20%">
      <stop offset="0%" stop-color="#ffb86c" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#ff6c8a" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0c0c14" stop-opacity="0"/>
    </radialGradient>

    <!-- AV Club accent (right side) -->
    <radialGradient id="li-glow-av" cx="80%" cy="50%" r="22%">
      <stop offset="0%" stop-color="#ffd76c" stop-opacity="0.035"/>
      <stop offset="60%" stop-color="#ffb86c" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0c0c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora band -->
    <linearGradient id="li-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6cffc4" stop-opacity="0"/>
      <stop offset="15%" stop-color="#6cffc4" stop-opacity="0.06"/>
      <stop offset="30%" stop-color="#6c9cff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#c49cff" stop-opacity="0.06"/>
      <stop offset="65%" stop-color="#ffb86c" stop-opacity="0.04"/>
      <stop offset="80%" stop-color="#ffd76c" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffd76c" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters (scaled down for smaller canvas) -->
    <filter id="li-blur"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="li-blur-sm"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="li-blur-lg"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- Atmosphere layers -->
  <rect width="1128" height="191" fill="url(#li-glow-1)"/>
  <rect width="1128" height="191" fill="url(#li-glow-hs)"/>
  <rect width="1128" height="191" fill="url(#li-glow-gm)"/>
  <rect width="1128" height="191" fill="url(#li-glow-av)"/>

  <!-- Horizontal aurora band -->
  <rect x="0" y="58" width="1128" height="68" fill="url(#li-band)" filter="url(#li-blur)"/>

  <!-- Subtle vertical light pillars (Honest Signal nod) — left side -->
  <rect x="270" y="29" width="2" height="97" fill="#6cffc4" opacity="0.04" filter="url(#li-blur-sm)"/>
  <rect x="313" y="19" width="3" height="116" fill="#6cffc4" opacity="0.05" filter="url(#li-blur-sm)"/>
  <rect x="349" y="34" width="2" height="87" fill="#6c9cff" opacity="0.04" filter="url(#li-blur-sm)"/>

  <!-- Ghost veils (center) -->
  <rect x="463" y="39" width="4" height="77" fill="#ffb86c" opacity="0.025" filter="url(#li-blur)"/>
  <rect x="513" y="43" width="5" height="68" fill="#ff6c8a" opacity="0.02" filter="url(#li-blur)"/>

  <!-- Waveform signal arcs (center-right) -->
  <path d="M605,94 Q698,77 783,87 Q855,94 961,82" fill="none" stroke="#c49cff" stroke-width="0.6" opacity="0.1" filter="url(#li-blur-sm)"/>
  <path d="M605,94 Q684,82 770,91 Q840,97 940,88" fill="none" stroke="#6c9cff" stroke-width="0.5" opacity="0.07"/>

  <!-- Burst point (Waveform nod) -->
  <circle cx="605" cy="94" r="2.2" fill="#c49cff" opacity="0.35"/>
  <circle cx="605" cy="94" r="7" fill="#c49cff" opacity="0.04" filter="url(#li-blur-sm)"/>

  <!-- Converging lines into burst -->
  <line x1="498" y1="72" x2="605" y2="94" stroke="#c49cff" stroke-width="0.3" opacity="0.04"/>
  <line x1="513" y1="116" x2="605" y2="94" stroke="#6c9cff" stroke-width="0.3" opacity="0.03"/>

  <!-- AV Club grid hint (right side, very subtle) -->
  <g stroke="#1a1a2e" stroke-width="0.2" opacity="0.3">
    <line x1="855" y1="39" x2="855" y2="154"/>
    <line x1="883" y1="39" x2="883" y2="154"/>
    <line x1="911" y1="39" x2="911" y2="154"/>
    <line x1="940" y1="39" x2="940" y2="154"/>
    <line x1="968" y1="39" x2="968" y2="154"/>
    <line x1="997" y1="39" x2="997" y2="154"/>
    <line x1="1025" y1="39" x2="1025" y2="154"/>
    <line x1="1054" y1="39" x2="1054" y2="154"/>
    <line x1="841" y1="48" x2="1068" y2="48"/>
    <line x1="841" y1="68" x2="1068" y2="68"/>
    <line x1="841" y1="87" x2="1068" y2="87"/>
    <line x1="841" y1="106" x2="1068" y2="106"/>
    <line x1="841" y1="125" x2="1068" y2="125"/>
    <line x1="841" y1="145" x2="1068" y2="145"/>
  </g>

  <!-- AV Club component hint -->
  <rect x="897" y="68" width="57" height="24" rx="2" fill="none" stroke="#ffd76c" stroke-width="0.4" opacity="0.08"/>
  <path d="M954,80 L982,80 L982,87 L997,87" fill="none" stroke="#ffd76c" stroke-width="0.4" opacity="0.06"/>
  <circle cx="897" cy="68" r="1.2" fill="#ffd76c" opacity="0.2"/>
  <circle cx="954" cy="80" r="1.2" fill="#ffd76c" opacity="0.2"/>
  <circle cx="997" cy="87" r="1" fill="#6c9cff" opacity="0.15"/>

  <!-- Energy node on signal arc -->
  <circle cx="748" cy="88" r="1.3" fill="#6cffc4" opacity="0.25"/>
  <circle cx="748" cy="88" r="3" fill="#6cffc4" opacity="0.03" filter="url(#li-blur-sm)"/>

  <!-- Terrain ridge -->
  <path d="M0,150 Q71,145 178,149 Q320,155 463,148 Q605,141 748,150 Q890,157 996,148 Q1068,143 1128,150 L1128,191 L0,191 Z" fill="#0a0a12" opacity="0.9"/>
  <path d="M0,160 Q107,156 249,159 Q391,164 534,157 Q677,152 819,159 Q961,165 1068,158 L1128,162 L1128,191 L0,191 Z" fill="#0c0c14"/>

  <!-- Terrain detail lines -->
  <path d="M0,164 Q142,162 285,163 Q427,166 570,162 Q712,159 855,163 Q997,166 1128,163" fill="none" stroke="#1a1a2a" stroke-width="0.3"/>
  <path d="M0,171 Q107,169 249,170 Q391,173 534,170 Q677,168 855,171 Q997,174 1128,171" fill="none" stroke="#1a1a2a" stroke-width="0.25"/>

  <!-- Terrain reflection -->
  <path d="M285,162 Q391,159 498,162" fill="none" stroke="#6cffc4" stroke-width="0.3" opacity="0.03"/>
  <path d="M641,160 Q712,158 783,160" fill="none" stroke="#c49cff" stroke-width="0.3" opacity="0.03"/>

  <!-- Stars -->
  <circle cx="356" cy="19" r="0.8" fill="#e8e8ed" opacity="0.4"/>
  <circle cx="555" cy="27" r="0.9" fill="#e8e8ed" opacity="0.3"/>
  <circle cx="783" cy="17" r="0.6" fill="#e8e8ed" opacity="0.35"/>
  <circle cx="655" cy="31" r="0.5" fill="#e8e8ed" opacity="0.25"/>
  <circle cx="961" cy="24" r="0.7" fill="#e8e8ed" opacity="0.3"/>
  <circle cx="427" cy="36" r="0.5" fill="#6cffc4" opacity="0.2"/>
  <circle cx="1033" cy="29" r="0.4" fill="#ffd76c" opacity="0.15"/>
  <circle cx="484" cy="14" r="0.4" fill="#e8e8ed" opacity="0.2"/>
  <circle cx="712" cy="24" r="0.5" fill="#c49cff" opacity="0.15"/>

  <!-- ============================================ -->
  <!-- Typography — positioned in center safe area -->
  <!-- ============================================ -->

  <!-- Tagline -->
  <text x="564" y="94" font-family="'Outfit', sans-serif" font-size="48" font-weight="700" fill="#e8e8ed" text-anchor="middle" letter-spacing="-0.5">Humans × AI</text>

  <!-- Subtitle -->
  <text x="564" y="124" font-family="'Outfit', sans-serif" font-size="20" font-weight="300" fill="#8888a0" text-anchor="middle" letter-spacing="0.5">Strategies, studio, and honest thinking for the age of AI</text>
</svg>
